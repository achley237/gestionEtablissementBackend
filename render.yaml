services:
  - type: web
    name: campus237-api
    env: python
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "campus237-api.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: campus237-db
          property: connectionString

databases:
  - name: campus237-db
    databaseName: campus237
    user: campus237_user